# Source Health — curated facts
#
# This file holds the DURABLE, hand-maintained knowledge about each source: the access
# path that actually works, the paths that are dead, and any extraction gotchas.
#
# Measured statistics (last-5-run status, success rate) are NOT stored here — they are
# computed from logs/*.yaml by scripts/derive_health.py, which merges them with this file
# to regenerate the human-readable SOURCE-HEALTH.md.
#
# WRITE-BACK RULE: when a run discovers a working path for a failing source, or discovers
# that a documented path is dead, update this file AND that source's strategy file in
# sources/. Notes alone are not enough — the strategy file is what the next run reads.

environment_blocks:
  # Hosts refused by the client itself. These are not source failures and no fallback
  # rung can rescue them. Verified 2026-07-29.
  - host: reddit.com (all subdomains, incl. old.reddit.com and .json paths)
    status: refused at client level
    impact: Reddit HTML is unreachable. Use api.pullpush.io (works). Never mark Reddit unavailable.
  - host: web.archive.org (incl. /cdx/ API)
    status: refused at client level
    impact: Wayback is unavailable as fallback tier. Reconstruct timelines from dated live sources.
  - host: archive.ph / archive.today
    status: refused at client level
    impact: archive.ph fallback tier unavailable.
  - host: timetravel.mementoweb.org
    status: DNS does not resolve
    impact: No memento aggregator available.
  - host: r.jina.ai
    status: 403 blocked by network security
    impact: Reader-proxy workaround unavailable.
  - host: facebook.com (groups + pages)
    status: fetches but returns title only
    impact: Group member counts and post content never obtainable. Source size claims elsewhere.
  - host: insurance-forums.com
    status: 403 on every path
    impact: Thread titles indexed by search; post bodies never retrievable.

working_fallback_chain:
  - platform API (pullpush, Algolia, EDGAR, FRED, Wikipedia REST)
  - alternate publisher of the same data (GlobeNewswire, BusinessWire, PRNewswire, trade press)
  - Google cache
  - Google snippet extraction (flag as snippet-sourced)

sources:
  web-search:
    tier: core
    works:
      - General WebSearch; fetch 4-6 top results directly.
      - "High-yield classes: trade associations, industry bodies, conference agenda pages,
         independent vendor user groups, press-release wires."
    dead:
      - "site:reddit.com — returns zero Reddit URLs"
    notes: >
      Most reliable source (100% across 24 logged runs) but a monoculture risk. Business,
      startup-idea and "best X" queries return a very high density of AI-generated SEO
      content — budget for aggressive triage. Known-403 publishers: GeekWire, CNBC.
    last_verified: 2026-07-29

  reddit-search:
    tier: core
    works:
      - "api.pullpush.io/reddit/search/submission/?q=<q>&size=25&sort=desc — VERIFIED"
      - "api.pullpush.io/reddit/search/comment/?q=<q>&score=>10&size=50 — VERIFIED, returns
         full comment bodies with score and subreddit"
      - "subreddit= and after=/before= (epoch) parameters both work"
    dead:
      - reddit.com / old.reddit.com / .json paths — refused at client
      - "WebSearch allowed_domains:[reddit.com] — API 400"
      - "site:reddit.com — zero Reddit URLs"
      - frontpagemetrics.com (404), subredditstats (defunct), r.jina.ai (403)
    notes: >
      Was previously marked "fully unavailable — do not budget fetches." That was WRONG and
      cost 20 runs of community signal. pullpush relevance matching is loose: quote phrases,
      scope by subreddit, and filter results manually. fields= parameter is ignored.
    last_verified: 2026-07-29

  youtube-search:
    tier: opportunistic
    works:
      - General WebSearch (unscoped) surfaces video pages with titles/descriptions in snippets
      - Direct watch-page fetch sometimes yields title, channel, views, description, chapters
      - "Best substitute: the creator's own site/blog/podcast page, which fetches cleanly"
    dead:
      - youtube.com/results?search_query= — footer nav only
      - youtube.com/api/timedtext — empty
      - youtubei/v1/player — HTTP 405
      - downsub.com — app shell, no transcript
      - youtubetotranscript.com — HTTP 403
      - Invidious public instances (inv.nadeko.net) — no response
      - "site:youtube.com — returns SEO listicles, not YouTube pages"
    notes: >
      TRANSCRIPTS ARE NOT OBTAINABLE. Every documented path tested and failed 2026-07-29.
      Description-level signal only; do not count toward sub-question coverage.
    last_verified: 2026-07-29

  hackernews-search:
    tier: optional
    works:
      - "hn.algolia.com/api/v1/search?query=<q>&tags=story — VERIFIED"
      - "hn.algolia.com/api/v1/items/<id> — full comment tree, no rate limits"
      - news.ycombinator.com/item?id= pages fetch cleanly
    dead: []
    notes: >
      Algolia is QUERY-SYNTAX SENSITIVE — quoted multi-term and OR queries return nbHits=0.
      Use short unquoted keywords plus numericFilters=points>N. If nbHits=0, drop a term and
      retry before concluding the topic is absent.
    last_verified: 2026-07-29

  news-search:
    tier: optional
    works:
      - Fortune, Forbes, Yahoo Finance fetch cleanly
      - Insurance Journal, GlobeNewswire, BusinessWire, PRNewswire, Coverager fetch cleanly
      - Trade press for any vertical is more reliable than general tech press
    dead:
      - GeekWire — 403
      - CNBC — 403
    notes: GlobeNewswire/BusinessWire are the reliable path to dated vendor adoption numbers.
    last_verified: 2026-07-27

  github-search:
    tier: optional
    works:
      - github.com/search?q=&type=repositories&sort=stars renders server-side
      - "raw.githubusercontent.com/<o>/<r>/main/README.md — preferred content path"
    dead:
      - "/blob/ HTML views — frequently return empty bodies"
    notes: Repo landing pages can be metadata-thin; recover via the raw README.
    last_verified: 2026-07-27

  g2-search:
    tier: optional
    works:
      - "Capterra — the ONLY reliable full fetch. Verbatims carry reviewer name, role,
         industry, company size, date."
      - "Get product IDs from a capterra.com/compare/<id1>-<id2>/ URL first"
      - GetApp fetches but returns ratings only, no verbatim text
    dead:
      - g2.com — 403
      - trustradius.com — 403
      - trustpilot.com — 403
      - gartner.com Peer Insights — unreachable
      - softwareadvice.com — 404 on review paths
    notes: Guessed Capterra /p/<id>/<Name>/reviews/ paths have 404'd repeatedly. Derive the ID.
    last_verified: 2026-07-27

  crunchbase-search:
    tier: optional
    works:
      - Press-release wires (GlobeNewswire, BusinessWire, PRNewswire, AccessWire) — primary path
      - SEC EDGAR Form D for private raises — primary source, prefer when it exists
      - Snippets for crunchbase.com carry total-raised and founded-year
    dead:
      - crunchbase.com — never fetched successfully in 3 logged runs
      - cbinsights.com — surfaces in results, does not fetch
      - pitchbook.com — paywalled
    notes: Repeat investors across competitors signal category conviction — more useful than round size.
    last_verified: 2026-07-27

  amazon-reviews:
    tier: optional
    works:
      - Google snippets carry product name, star rating, review count
      - "Reddit via pullpush is the strongest substitute for real verbatims"
      - Manufacturer/non-Amazon retailer pages and RTINGS/Wirecutter often fetch
    dead:
      - amazon.com product and review pages — HTML head only, no body
    notes: >
      Watch for variant-merging (reviews from a different model pooled onto one listing) and
      incentivized reviews. Corroborate strong claims against Reddit before calling consensus.
    last_verified: 2026-07-27

  trends-search:
    tier: optional
    works:
      - "pullpush comment counts per time window — a genuine fetchable demand time-series"
      - Job-posting volume, funding flow, new-launch counts as demand proxies
      - Google Trends screenshots republished inside dated articles
    dead:
      - trends.google.com/trends/explore — JS app, no time-series via WebFetch
    notes: >
      NO Google Trends data has ever been obtained. Falls back to vendor market-size reports,
      which are consistently INFLATED — always name the publishing firm and its incentive.
    last_verified: 2026-07-27

  wayback-search:
    tier: optional
    works:
      - Press-release wires (date-stamped) read chronologically
      - Company's own /blog, /changelog, /releases pages
      - Dated third-party commentary and Capterra verbatims (which carry dates)
    dead:
      - web.archive.org (all paths incl. CDX API) — refused at client
      - archive.ph — refused at client
      - timetravel.mementoweb.org — DNS failure
    notes: >
      No web archive is reachable. Skill repurposed to reconstruct timelines from dated live
      sources; reports must say the timeline is a reconstruction and name coverage gaps.
    last_verified: 2026-07-29

  linkedin-search:
    tier: optional
    works:
      - "Google snippets only — reliably carry group member counts and company follower counts"
    dead:
      - linkedin.com URLs including /pulse and /posts — never fetched successfully
    notes: Good for audience sizing, useless for content. Substitute trade press; use blind-search for employee views.
    last_verified: 2026-07-27

  blind-search:
    tier: optional
    works:
      - teamblind.com post URLs fetch cleanly and return full reply threads with employer tags
    dead: []
    notes: >
      High value as a Reddit substitute for workplace topics — verified employees,
      financially disinterested, unusually candid.
    last_verified: 2026-07-27

  twitter-search:
    tier: optional
    works:
      - threadreaderapp, syndicated embeds, snippets from x.com status URLs
    dead:
      - x.com / twitter.com direct — login wall
    notes: Snippet-level only in practice.
    last_verified: 2026-07-27

  quora-search:
    tier: optional
