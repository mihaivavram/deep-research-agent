cross_cutting_lessons:
  - id: b2b-niche-mapping
    added: 2026-07-27
    lesson: >
      For B2B niche audience/venue mapping the social platforms are all gated, and the
      highest-yield sources are institutional: trade-association sites, independent vendor
      user groups, conference agenda pages (session titles reveal which job roles own which
      problem), and industry-body directories with named executive contacts. Budget fetches
      there, not at Reddit/Facebook/LinkedIn.
  - id: api-before-surrender
    added: 2026-07-29
    lesson: >
      Never record a source as unavailable without trying a platform API. Reddit was written
      off for ~20 runs while api.pullpush.io worked the whole time. A blocked HTML page is not
      evidence the data is inaccessible, and a surrender persisted into source health
      suppresses every future attempt.
  - id: pdf-emoji-loss
    added: 2026-07-29
    lesson: >
      scripts/report_pdf.py embeds Arial/DejaVu, which have no emoji coverage, so emoji
      silently vanish from PDFs. md_to_pdf.py now transliterates emoji to ASCII markers
      before rendering — keep that mapping updated rather than putting raw emoji in reports.
